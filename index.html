<!DOCTYPE html>
<html>
<head>
  <title>najja?ut</title>
  <style>
    .counter-button {
      color: #093b0b;
      background-color: #4CAF50;
      font-size: 24px;
      padding: 16px 32px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .counter-display {
      font-size: 28px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <button class="counter-button" onclick="incrementCounter()">
    Clihikcs25?me!
  </button>
  <div class="counter-display" id="counter">
    Clicks: 0
  </div>

  <script>
    let count = 0;
    function incrementCounter() {
      count++;
      document.getElementById('counter').textContent = 'Clicks: ' + count;
    }
  </script>
</body>
</html>
